version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./mediafiles:/app/mediafiles:ro
    depends_on:
      - web
      - daphne

  web:
    build: .
    restart: always
    command: gunicorn -c config/gunicorn.conf.py config.wsgi:application
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  daphne:
    build: .
    restart: always
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    restart: always
    command: celery -A config worker -l info --concurrency=4
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=petconnect_prod_db
      - POSTGRES_USER=petconnect_prod_admin
      - POSTGRES_PASSWORD=petconnect_prod_secret_pass_2026

  redis:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --appendonly yes

volumes:
  postgres_prod_data:
