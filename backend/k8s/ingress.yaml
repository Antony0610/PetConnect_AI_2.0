apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petconnect-ingress
  namespace: petconnect-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  tls:
    - hosts:
        - api.petconnect.ai
      secretName: petconnect-tls-cert
  rules:
    - host: api.petconnect.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petconnect-backend-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: petconnect-hpa
  namespace: petconnect-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petconnect-backend-deployment
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
